<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>AR Test - Model Viewer</title>

<!-- Model Viewer stabile -->
<script type="module"
src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
</script>

<style>
body {
margin: 0;
background: #000;
}

model-viewer {
width: 100vw;
height: 100vh;
}

/* Pulsante AR più grande */
model-viewer::part(default-ar-button) {
width: 90px;
height: 90px;
border-radius: 50%;
background: white;
color: black;
font-size: 1.8rem;
}
</style>
</head>

<body>

<model-viewer
src="AP6250E_v3.glb"
ar
ar-modes="scene-viewer quick-look"
camera-controls
auto-rotate
exposure="1"
shadow-intensity="1"
alt="3D model">
</model-viewer>

</body>
</html>
