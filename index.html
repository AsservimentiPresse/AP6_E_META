
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>ASSIEME - AR Viewer</title>

<!-- Model Viewer (versione aggiornata, compatibile meshoptimizer) -->
<script type="module"
src="https://unpkg.com/@google/model-viewer@latest/dist/model-viewer.min.js">
</script>

<style>
body {
margin: 0;
background: #000;
display: flex;
flex-direction: column;
align-items: center;
color: white;
font-family: sans-serif;
}

model-viewer {
width: 95vw;
height: 75vh;
}

/* === PULSANTE AR PIÙ GRANDE === */
model-viewer::part(default-ar-button) {
width: 100px; /* dimensione pulsante */
height: 100px;
border-radius: 50%;
background-color: white;
color: black;
border: none;
font-size: 2rem;
}

/* === CONTROLLI COLORI === */
.controls-section {
display: flex;
align-items: center;
margin: 10px 0;
width: 95vw;
}

.controls-section h3 {
margin: 0 15px 0 0;
font-size: 1.4rem;
min-width: 180px;
text-align: left;
}

.controls {
display: flex;
flex-wrap: wrap;
gap: 10px;
}

button {
padding: 10px 20px;
border: none;
border-radius: 12px;
cursor: pointer;
font-size: 1rem;
min-width: 90px;
color: white;
}

.green { background: rgb(0, 120, 0); }
.blue { background: rgb(0, 0, 180); }
.yellow { background: rgb(230, 200, 0); color: black; }
.lightgray { background: rgb(200, 200, 200); color: black; }
.darkgray { background: rgb(80, 80, 80); }
.red { background: rgb(180, 0, 0); }
</style>
</head>

<body>

<!-- === MODEL VIEWER === -->
<model-viewer id="viewer"
src="AP6250E_v2.glb"
ar
ar-modes="webxr scene-viewer quick-look"
camera-controls
auto-rotate
autoplay
shadow-intensity="0"
exposure="0.5"
alt="ASSIEME 3D Model">
</model-viewer>

<!-- === STRUCTURE COLOR === -->
<div class="controls-section">
<h3>Structure Color</h3>
<div class="controls">
<button class="green" onclick="changeColorByName('Structure', [0, 0.1, 0, 1])">Verde</button>
<button class="blue" onclick="changeColorByName('Structure', [0, 0, 0.18, 1])">Blu</button>
<button class="yellow" onclick="changeColorByName('Structure', [1, 0.8, 0, 1])">Giallo</button>
<button class="lightgray" onclick="changeColorByName('Structure', [0.55, 0.55, 0.55, 1])">Grigio chiaro</button>
<button class="darkgray" onclick="changeColorByName('Structure', [0.25, 0.25, 0.25, 1])">Grigio scuro</button>
<button class="red" onclick="changeColorByName('Structure', [0.22, 0, 0, 1])">Rosso</button>
</div>
</div>

<!-- === MOBILE PARTS COLOR === -->
<div class="controls-section">
<h3>Mobile Parts Color</h3>
<div class="controls">
<button class="green" onclick="changeColorByName('Mobile_Parts', [0, 0.1, 0, 1])">Verde</button>
<button class="blue" onclick="changeColorByName('Mobile_Parts', [0, 0, 1, 1])">Blu</button>
<button class="yellow" onclick="changeColorByName('Mobile_Parts', [1, 1, 0, 1])">Giallo</button>
<button class="lightgray" onclick="changeColorByName('Mobile_Parts', [0.55, 0.55, 0.55, 1])">Grigio chiaro</button>
<button class="darkgray" onclick="changeColorByName('Mobile_Parts', [0.33, 0.33, 0.33, 1])">Grigio scuro</button>
<button class="red" onclick="changeColorByName('Mobile_Parts', [1, 0, 0, 1])">Rosso</button>
</div>
</div>

<!-- === SCRIPT === -->
<script>
const modelViewer = document.querySelector('#viewer');

/* Debug: stampa i materiali disponibili */
modelViewer.addEventListener('load', () => {
console.log('Modello caricato');
modelViewer.model.materials.forEach((m, i) => {
console.log(i, m.name);
});
});

/* Cambio colore per NOME materiale (robusto, meshoptimizer-safe) */
function changeColorByName(materialName, rgba) {
const material = modelViewer.model.materials.find(
m => m.name === materialName
);

if (material && material.pbrMetallicRoughness) {
material.pbrMetallicRoughness.setBaseColorFactor(rgba);
} else {
console.warn('Materiale non trovato:', materialName);
}
}
</script>

</body>
</html>
